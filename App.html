<script>
(function () {
'use strict';

/* ================= Trạng thái & tiện ích ================= */
const S = { token: null, me: null, fields: [], sections: [], nvFields: [], fmap: {}, config: {}, hrMeta: null, tab: 'pending', listQ: '', listSt: 'ALL', reqSt: 'CHO_XU_LY', dirtyForm: null, currentNv: null };
const STATUS = { CHUA_BAT_DAU: 'Chưa bắt đầu', NHAP: 'Đang soạn', CHO_DUYET: 'Chờ duyệt', TU_CHOI: 'Cần bổ sung', DA_DUYET: 'Đã duyệt', MO_CHINH_SUA: 'Được chỉnh sửa' };
const EDITABLE = ['CHUA_BAT_DAU', 'NHAP', 'TU_CHOI', 'MO_CHINH_SUA'];
const LOG_LABEL = { DANG_NHAP: 'Đăng nhập', NOP_HO_SO: 'Nộp hồ sơ', RUT_HO_SO: 'Rút hồ sơ', YEU_CAU_SUA: 'Gửi yêu cầu chỉnh sửa', DUYET: 'Duyệt hồ sơ', NS_CAP_NHAT: 'Nhân sự cập nhật', TRA_LAI: 'Trả lại hồ sơ', MO_CHINH_SUA: 'Mở chỉnh sửa', CHAP_NHAN_YC: 'Chấp nhận yêu cầu sửa', TU_CHOI_YC: 'Từ chối yêu cầu sửa', THEM_NHAN_VIEN: 'Thêm nhân viên', GUI_LOI_MOI: 'Gửi lời mời' };
const YC_LABEL = { CHO_XU_LY: 'Chờ xử lý', CHAP_NHAN: 'Đã chấp nhận', TU_CHOI: 'Đã từ chối' };

const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fold = s => String(s || '').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/\s+/g, ' ');
const app = $('#app');
const LOADING = '<div class="loading-page"><div class="spinner"></div><p>Đang tải…</p></div>';
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { try { return sessionStorage.getItem(k); } catch (x) { return null; } } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { try { sessionStorage.setItem(k, v); } catch (x) { /* ignore */ } } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } try { sessionStorage.removeItem(k); } catch (e) { /* ignore */ } },
};

function call(action, payload) {
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(raw => {
        let o;
        try { o = JSON.parse(raw); } catch (e) { return reject(new Error('Phản hồi không hợp lệ từ máy chủ.')); }
        if (o.ok) return resolve(o.data);
        const err = new Error(o.error || 'Có lỗi xảy ra');
        err.code = o.code;
        if (o.code === 'AUTH') { S.token = null; store.del('hs_token'); setTimeout(renderLogin, 50); }
        reject(err);
      })
      .withFailureHandler(e => reject(new Error((e && e.message) || 'Mất kết nối, vui lòng thử lại.')))
      .api(action, S.token, payload || {});
  });
}

let busyN = 0;
function busy(on, text) {
  busyN = Math.max(0, busyN + (on ? 1 : -1));
  if (on && text) $('#busyText').textContent = text;
  $('#busy').classList.toggle('hidden', busyN === 0);
}
async function run(text, fn) { busy(true, text); try { return await fn(); } finally { busy(false); } }

function toast(msg, type, ms) {
  const el = document.createElement('div');
  el.className = 'toast ' + (type || '');
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), ms || (type === 'err' ? 6500 : 3200));
}

let modalOnClose = null;
function modal(o) {
  $('#modalTitle').textContent = o.title || '';
  $('#modalBody').innerHTML = o.body || '';
  $('#modalFoot').innerHTML = o.foot || '';
  modalOnClose = o.onClose || null;
  $('#modal').classList.remove('hidden');
  $$('[data-close]', $('#modal')).forEach(b => b.onclick = closeModal);
  return $('#modal');
}
function closeModal() {
  $('#modal').classList.add('hidden');
  const f = modalOnClose; modalOnClose = null;
  if (f) try { f(); } catch (e) { /* ignore */ }
}
$('#modalClose').onclick = closeModal;
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

/** Hộp thoại xác nhận có ô ghi chú. Trả về Promise<string|null> */
function ask(o) {
  return new Promise(resolve => {
    let done = false;
    modal({
      title: o.title,
      body: (o.html || '') + (o.input ? `<div class="field" style="margin-top:10px"><label class="lbl">${esc(o.input)}${o.required ? '<span class="req">*</span>' : ''}</label><textarea id="askInput" rows="4" placeholder="${esc(o.placeholder || '')}">${esc(o.value || '')}</textarea></div>` : ''),
      foot: `<button class="btn sec" data-close>${esc(o.cancel || 'Hủy')}</button><button class="btn ${o.cls || ''}" id="askOk">${esc(o.ok || 'Đồng ý')}</button>`,
      onClose: () => { if (!done) resolve(null); },
    });
    $('#askOk').onclick = () => {
      const v = o.input ? $('#askInput').value.trim() : '';
      if (o.required && !v) { toast('Vui lòng nhập ' + o.input.toLowerCase(), 'err'); return; }
      done = true; closeModal(); resolve(v);
    };
    if (o.input) setTimeout(() => $('#askInput') && $('#askInput').focus(), 50);
  });
}

const badge = st => `<span class="badge b-${esc(st)}">${esc(STATUS[st] || st)}</span>`;
const initials = n => { const p = String(n || '?').trim().split(/\s+/); return esc((p[p.length - 1] || '?').charAt(0).toUpperCase()); };
const fmtDate = s => { const m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? `${m[3]}/${m[2]}/${m[1]}` : String(s || ''); };
const isFileF = f => f.type === 'file' || f.type === 'image';
const fileObj = v => { if (!v) return null; if (typeof v === 'object') return v.v ? v : null; const s = String(v); return { v: s, url: /^https?:/i.test(s) ? s : '', name: s.split('/').pop() }; };
const dispVal = (f, v) => isFileF(f) ? ((fileObj(v) || {}).name || '') : f.type === 'date' ? fmtDate(v) : String(v == null ? '' : v);
const sameVal = (f, a, b) => isFileF(f) ? ((fileObj(a) || {}).v || '') === ((fileObj(b) || {}).v || '') : String(a == null ? '' : a).trim() === String(b == null ? '' : b).trim();

window.addEventListener('beforeunload', e => { if (S.dirtyForm && S.dirtyForm.dirty) { e.preventDefault(); e.returnValue = ''; } });

/* ================= Khởi động & đăng nhập ================= */
async function boot() {
  S.token = S.token || store.get('hs_token');
  if (!S.token) return renderLogin();
  app.innerHTML = LOADING;
  try {
    const me = await call('me');
    S.me = me.user; S.fields = me.fields; S.sections = me.sections; S.nvFields = me.nvFields || []; S.config = me.config || {};
    S.fmap = {}; S.fields.forEach(f => { S.fmap[f.key] = f; });
    renderUserBox();
    if (S.me.role) renderHr('pending'); else renderEmployee(app);
  } catch (e) {
    if (e.code === 'AUTH') return;
    app.innerHTML = `<div class="card"><div class="alert err">${esc(e.message)}</div><button class="btn" id="retry">Thử lại</button></div>`;
    $('#retry').onclick = boot;
  }
}

function renderUserBox() {
  const b = $('#userBox');
  b.innerHTML = `<span class="who">${esc(S.me.name || S.me.email)}${S.me.role ? ' · Nhân sự' : ''}</span><button id="btnLogout">Đăng xuất</button>`;
  b.classList.remove('hidden');
  $('#btnLogout').onclick = async () => {
    if (S.dirtyForm && S.dirtyForm.dirty && !confirm('Bạn có thay đổi chưa lưu. Vẫn đăng xuất?')) return;
    try { await call('logout'); } catch (e) { /* ignore */ }
    S.token = null; S.me = null; S.hrMeta = null; S.dirtyForm = null; store.del('hs_token');
    renderLogin();
  };
}

function renderLogin() {
  S.dirtyForm = null;
  $('#userBox').classList.add('hidden');
  app.innerHTML = `<div class="login-wrap"><div class="card">
    <h2>Đăng nhập</h2>
    <p class="muted small">Dùng <b>email cá nhân</b> bạn đã cung cấp cho phòng Nhân sự. Mã xác thực 6 số sẽ được gửi vào email này.</p>
    <div id="step1">
      <div class="field"><label class="lbl" for="lgEmail">Email cá nhân</label><input type="email" id="lgEmail" autocomplete="email" placeholder="tenban@gmail.com"></div>
      <button class="btn block" id="btnOtp" style="margin-top:14px">Gửi mã đăng nhập</button>
    </div>
    <div id="step2" class="hidden">
      <p class="small">Đã gửi mã tới <b id="sentTo"></b>.<br><span class="muted">Không thấy email? Hãy kiểm tra thư mục Spam / Quảng cáo.</span></p>
      <div class="field"><input type="text" inputmode="numeric" maxlength="6" id="lgCode" class="otp-input" autocomplete="one-time-code" placeholder="••••••"></div>
      <button class="btn block" id="btnVerify" style="margin-top:14px">Đăng nhập</button>
      <div class="row" style="margin-top:10px;justify-content:space-between">
        <button class="btn ghost sm" id="btnBack">← Đổi email</button><button class="btn ghost sm" id="btnResend">Gửi lại mã</button>
      </div>
    </div></div></div>`;
  const em = $('#lgEmail');
  em.value = store.get('hs_email') || '';
  const send = async () => {
    const email = em.value.trim().toLowerCase();
    if (!EMAIL_RE.test(email)) return toast('Email không hợp lệ', 'err');
    try {
      await run('Đang gửi mã…', () => call('requestOtp', { email }));
      store.set('hs_email', email);
      $('#sentTo').textContent = email;
      $('#step1').classList.add('hidden'); $('#step2').classList.remove('hidden');
      $('#lgCode').value = ''; $('#lgCode').focus();
      toast('Đã gửi mã đăng nhập vào email', 'ok');
    } catch (e) { toast(e.message, 'err'); }
  };
  let verifying = false;
  const verify = async () => {
    const code = $('#lgCode').value.replace(/\D/g, '');
    if (code.length !== 6) return toast('Vui lòng nhập đủ 6 số', 'err');
    if (verifying) return;
    verifying = true;
    try {
      const r = await run('Đang xác thực…', () => call('verifyOtp', { email: store.get('hs_email'), code }));
      S.token = r.token; store.set('hs_token', r.token);
      await boot();
    } catch (e) { toast(e.message, 'err'); } finally { verifying = false; }
  };
  $('#btnOtp').onclick = send;
  em.onkeydown = e => { if (e.key === 'Enter') send(); };
  $('#btnResend').onclick = send;
  $('#btnBack').onclick = () => { $('#step2').classList.add('hidden'); $('#step1').classList.remove('hidden'); em.focus(); };
  $('#btnVerify').onclick = verify;
  $('#lgCode').oninput = e => { if (e.target.value.replace(/\D/g, '').length === 6) verify(); };
  $('#lgCode').onkeydown = e => { if (e.key === 'Enter') verify(); };
}

/* ================= Bộ dựng form ================= */
function formState(o) {
  return Object.assign({ data: {}, editable: false, hr: false, received: {}, compare: null, maNV: null, previews: {}, errors: {}, dirty: false, onChange: null, onUploaded: null }, o);
}

function fileBoxHtml(f, st) {
  const fv = fileObj(st.data[f.key]);
  const prev = st.previews[f.key];
  const thumb = prev ? `<img src="${prev}" alt="">` : (fv ? (f.type === 'image' ? '🖼️' : '📄') : '➕');
  const nm = fv ? ((st.hr && fv.url) ? `<a href="${esc(fv.url)}" target="_blank" rel="noopener">${esc(fv.name || 'Xem tệp')}</a>` : esc(fv.name || 'Tệp đã tải')) : '<span class="muted">Chưa tải lên</span>';
  const accept = f.type === 'image' ? 'image/*' : 'image/*,application/pdf,.pdf,.doc,.docx';
  let acts = '';
  if (st.editable) {
    acts = `<label class="btn sec sm">${fv ? 'Thay tệp' : 'Tải lên'}<input type="file" data-upload="${f.key}" accept="${accept}"></label>`;
    if (f.type === 'image') acts += `<label class="btn sec sm">📷 Chụp<input type="file" data-upload="${f.key}" accept="image/*" capture="${f.key === 'HinhAnhCaNhan' ? 'user' : 'environment'}"></label>`;
    if (fv) acts += `<button class="btn ghost sm" type="button" data-remove="${f.key}">Xóa</button>`;
  }
  return `<div class="filebox"><div class="thumb">${thumb}</div><div class="fi"><div class="nm">${nm}</div><div class="muted small">${fv ? '✓ Đã có tệp' : (f.type === 'image' ? 'Ảnh JPG/PNG' : 'PDF, Word hoặc ảnh')}</div></div><div class="acts">${acts}</div></div>`;
}

function fieldHtml(f, st) {
  const v = st.data[f.key] == null ? '' : st.data[f.key];
  const id = 'f_' + f.key;
  const file = isFileF(f);
  const changed = !!(st.compare && !sameVal(f, v, st.compare[f.key]));
  const cls = 'field' + ((f.type === 'textarea' || file) ? ' full' : '') + (changed ? ' changed' : '') + (st.errors[f.key] ? ' err' : '');
  const label = `<label class="lbl" for="${id}">${esc(f.label)}${f.required ? '<span class="req">*</span>' : ''}</label>`;
  let inner;
  if (file) inner = fileBoxHtml(f, st);
  else if (!st.editable) {
    const d = dispVal(f, v);
    inner = `<div class="view-val ${d ? '' : 'empty'}">${esc(d || 'Chưa có')}</div>`;
  } else if (f.type === 'select') {
    const opts = (f.options || []).slice();
    if (v && opts.indexOf(v) < 0) opts.unshift(v);
    inner = `<select id="${id}" data-key="${f.key}" ${f.readonly ? 'disabled' : ''}><option value="">-- Chọn --</option>${opts.map(o => `<option value="${esc(o)}" ${o === v ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
  } else if (f.type === 'textarea') {
    inner = `<textarea id="${id}" data-key="${f.key}" rows="3" ${f.readonly ? 'readonly' : ''}>${esc(v)}</textarea>`;
  } else {
    const type = { date: 'date', email: 'email', tel: 'tel', number: 'number' }[f.type] || 'text';
    const extra = (f.type === 'digits' ? ' inputmode="numeric"' : '') + (f.type === 'number' ? ' min="0" step="1"' : '') + (f.suggest ? ` list="dl_${f.key}"` : '');
    inner = `<input type="${type}" id="${id}" data-key="${f.key}" value="${esc(v)}"${extra} ${f.readonly ? 'readonly' : ''} autocomplete="off">` +
      (f.suggest ? `<datalist id="dl_${f.key}">${f.suggest.map(s => `<option value="${esc(s)}">`).join('')}</datalist>` : '');
  }
  const hint = (f.hint && st.editable) ? `<div class="hint">${esc(f.hint)}</div>` : '';
  const old = changed ? `<div class="old">Đang lưu: ${esc(dispVal(f, st.compare[f.key]) || '(trống)')}</div>` : '';
  const err = st.errors[f.key] ? `<div class="errmsg">${esc(st.errors[f.key])}</div>` : '';
  const recv = (st.hr && f.recv) ? `<label class="recv"><input type="checkbox" data-recv="${f.recv}" ${st.received[f.recv] ? 'checked' : ''}> Đã nhận / đã kiểm tra bản gốc</label>` : '';
  return `<div class="${cls}" data-field="${f.key}">${label}${inner}${hint}${old}${err}${recv}</div>`;
}

function scanBoxHtml() {
  return `<div class="scanbox" style="margin-bottom:14px"><div class="icon">🪪</div><b>Quét mã QR trên CCCD để điền tự động</b>
    <p class="muted small">Mã QR nằm ở góc trên bên phải mặt trước CCCD gắn chip / thẻ Căn cước.</p>
    <div class="row" style="justify-content:center">
      <button class="btn" type="button" data-act="scan-live">📷 Quét bằng camera</button>
      <label class="btn sec">🖼️ Chụp / chọn ảnh mã QR<input type="file" accept="image/*" data-act="scan-file" hidden></label>
    </div></div>`;
}

function formHtml(st) {
  let n = 0;
  return S.sections.map(sec => {
    const fs = S.fields.filter(f => f.section === sec.id);
    if (!fs.length) return '';
    n++;
    return `<section class="card" data-sec="${sec.id}"><h3><span class="sec-num">${n}</span>${esc(sec.title)}</h3>${(sec.id === 'cccd' && st.editable) ? scanBoxHtml() : ''}<div class="grid">${fs.map(f => fieldHtml(f, st)).join('')}</div></section>`;
  }).join('');
}

function rerenderField(root, st, key) {
  const el = root.querySelector(`[data-field="${key}"]`);
  if (el) el.outerHTML = fieldHtml(S.fmap[key], st);
}

function bindForm(root, st) {
  const onEdit = e => {
    const t = e.target;
    if (t.dataset.key) {
      st.data[t.dataset.key] = t.value;
      st.dirty = true;
      if (st.errors[t.dataset.key]) {
        delete st.errors[t.dataset.key];
        const fe = t.closest('.field'); fe.classList.remove('err'); const m = $('.errmsg', fe); if (m) m.remove();
      }
      if (st.onChange) st.onChange();
    } else if (t.dataset.recv) {
      st.received[t.dataset.recv] = t.checked; st.dirty = true;
    }
  };
  root.addEventListener('input', onEdit);
  root.addEventListener('change', e => {
    const t = e.target;
    if (t.dataset.upload && t.files && t.files[0]) { const file = t.files[0]; t.value = ''; handleUpload(S.fmap[t.dataset.upload], file, st, root); return; }
    if (t.dataset.act === 'scan-file' && t.files && t.files[0]) { const file = t.files[0]; t.value = ''; scanFromFile(file, st, root); return; }
    onEdit(e);
  });
  root.addEventListener('click', e => {
    const t = e.target.closest('[data-remove],[data-act="scan-live"]');
    if (!t) return;
    if (t.dataset.remove) {
      st.data[t.dataset.remove] = ''; delete st.previews[t.dataset.remove]; st.dirty = true;
      rerenderField(root, st, t.dataset.remove);
      if (st.onChange) st.onChange();
    } else scanLive(st, root);
  });
}

/* ---------- Kiểm tra dữ liệu ở client (giống server) ---------- */
function validateClient(data) {
  const errs = {};
  S.fields.forEach(f => {
    if (f.readonly) return;
    const v = data[f.key];
    const empty = isFileF(f) ? !fileObj(v) : String(v == null ? '' : v).trim() === '';
    if (empty) { if (f.required) errs[f.key] = 'Bắt buộc'; return; }
    if (f.pattern && !isFileF(f) && !new RegExp(f.pattern).test(String(v).replace(/[\s.]/g, ''))) errs[f.key] = 'Không đúng định dạng' + (f.hint ? ` (${f.hint})` : '');
    if (f.type === 'date' && String(v) > new Date().toISOString().slice(0, 10)) errs[f.key] = 'Ngày không hợp lệ';
  });
  if (data.NgaySinh && data.NgayCap && !errs.NgayCap && data.NgayCap <= data.NgaySinh) errs.NgayCap = 'Ngày cấp phải sau ngày sinh';
  return errs;
}

function completion(data) {
  const req = S.fields.filter(f => f.required && !f.readonly);
  const done = req.filter(f => isFileF(f) ? !!fileObj(data[f.key]) : String(data[f.key] == null ? '' : data[f.key]).trim() !== '').length;
  return { done, total: req.length, pct: req.length ? Math.round(done * 100 / req.length) : 100 };
}

/* ---------- Tải file ---------- */
function blobToBase64(blob) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(blob); });
}
function loadImage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); res(img); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Không đọc được ảnh')); };
    img.src = url;
  });
}
async function compressImage(file, max, q) {
  const img = await loadImage(file);
  const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.round(img.naturalWidth * scale), h = Math.round(img.naturalHeight * scale);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', q));
  const t = document.createElement('canvas'); const ts = 120 / Math.max(w, h); t.width = Math.round(w * ts); t.height = Math.round(h * ts);
  t.getContext('2d').drawImage(c, 0, 0, t.width, t.height);
  return { blob, preview: t.toDataURL('image/jpeg', 0.7) };
}
function guessMime(name) {
  const ext = String(name).split('.').pop().toLowerCase();
  return { pdf: 'application/pdf', doc: 'application/msword', docx: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document', jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', heic: 'image/heic', heif: 'image/heif', webp: 'image/webp' }[ext] || '';
}

async function handleUpload(f, file, st, root) {
  const maxMb = S.config.maxFileMb || 10;
  let blob = file, mime = file.type || guessMime(file.name), name = file.name || 'file';
  if (/^image\//.test(mime) && !/heic|heif/.test(mime)) {
    try { const r = await compressImage(file, 1800, 0.85); blob = r.blob; mime = 'image/jpeg'; name = name.replace(/\.[^.]+$/, '') + '.jpg'; st.previews[f.key] = r.preview; } catch (e) { /* giữ nguyên file gốc */ }
  }
  if (f.type === 'image' && !/^image\//.test(mime)) return toast(f.label + ' phải là file ảnh', 'err');
  if (blob.size > maxMb * 1024 * 1024) return toast(`File quá lớn (tối đa ${maxMb}MB)`, 'err');
  try {
    const base64 = await blobToBase64(blob);
    const res = await run('Đang tải lên ' + f.label + '…', () => call(st.hr ? 'hrUploadFile' : 'uploadFile', { maNV: st.maNV, field: f.key, name, mime, base64 }));
    st.data[f.key] = res; st.dirty = true;
    if (st.errors[f.key]) delete st.errors[f.key];
    rerenderField(root, st, f.key);
    toast('Đã tải lên: ' + f.label, 'ok');
    if (st.onChange) st.onChange();
    if (st.onUploaded) st.onUploaded();
  } catch (e) { delete st.previews[f.key]; toast(e.message, 'err'); }
}

/* ---------- Quét QR CCCD ---------- */
/** Định dạng QR CCCD: SoCCCD|SoCMND|HoTen|NgaySinh(ddMMyyyy)|GioiTinh|DiaChi|NgayCap(ddMMyyyy) */
function parseCccd(text) {
  const parts = String(text || '').trim().split('|').map(s => s.trim());
  if (parts.length < 6 || !/^\d{12}$/.test(parts[0])) return null;
  const d = s => /^\d{8}$/.test(s || '') ? `${s.slice(4, 8)}-${s.slice(2, 4)}-${s.slice(0, 2)}` : '';
  let g = (parts[4] || '').normalize('NFC');
  if (/^n[uữ]/i.test(fold(g)) && fold(g) !== 'nam') g = 'Nữ';
  else if (fold(g) === 'nam') g = 'Nam';
  return {
    SoCCCD: parts[0],
    SoCMND: /^(\d{9}|\d{12})$/.test(parts[1] || '') ? parts[1] : '',
    HoVaTen: (parts[2] || '').normalize('NFC'),
    NgaySinh: d(parts[3]),
    GioiTinh: g,
    DiaChiThuongTru: (parts[5] || '').normalize('NFC'),
    NgayCap: d(parts[6]),
  };
}
window.__parseCccd = parseCccd; // phục vụ kiểm thử

let qrInst = null;
function qrConfig() {
  return { formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE], experimentalFeatures: { useBarCodeDetectorIfSupported: true }, verbose: false };
}
function stopQr() {
  if (!qrInst) return;
  const q = qrInst; qrInst = null;
  try { q.stop().then(() => q.clear()).catch(() => {}); } catch (e) { /* ignore */ }
}
async function scanLive(st, root) {
  if (typeof Html5Qrcode === 'undefined') return toast('Chưa tải được thư viện quét QR, vui lòng kiểm tra mạng.', 'err');
  modal({
    title: 'Quét mã QR trên CCCD',
    body: '<div id="qr-reader"></div><p class="muted small" style="margin-top:10px">Đưa mã QR vào giữa khung, giữ máy cách thẻ 10–15 cm, đủ sáng và không bị lóa.</p>',
    foot: '<button class="btn sec" data-close>Đóng</button>',
    onClose: stopQr,
  });
  try {
    qrInst = new Html5Qrcode('qr-reader', qrConfig());
    await qrInst.start({ facingMode: 'environment' },
      { fps: 10, qrbox: (w, h) => { const s = Math.floor(Math.min(w, h) * 0.8); return { width: s, height: s }; } },
      txt => { closeModal(); onQr(txt, st, root); }, () => {});
  } catch (e) {
    closeModal();
    toast('Không mở được camera trực tiếp trên thiết bị này.\nHãy dùng nút "Chụp / chọn ảnh mã QR".', 'err', 8000);
  }
}
async function scanFromFile(file, st, root) {
  if (typeof Html5Qrcode === 'undefined') return toast('Chưa tải được thư viện quét QR, vui lòng kiểm tra mạng.', 'err');
  const q = new Html5Qrcode('qr-hidden', qrConfig());
  const attempt = async () => {
    try { return await q.scanFile(file, false); } catch (e) { /* thử tiếp */ }
    for (const size of [1600, 1000, 700]) {
      try { const r = await compressImage(file, size, 0.95); return await q.scanFile(new File([r.blob], 'qr.jpg', { type: 'image/jpeg' }), false); } catch (e) { /* thử tiếp */ }
    }
    throw new Error('notfound');
  };
  try {
    const txt = await run('Đang đọc mã QR…', attempt);
    onQr(txt, st, root);
  } catch (e) {
    toast('Không đọc được mã QR.\nHãy chụp gần mã QR hơn (mã chiếm phần lớn khung hình), đủ sáng, không bị lóa rồi thử lại.', 'err', 8000);
  } finally { try { q.clear(); } catch (e) { /* ignore */ } }
}
function onQr(text, st, root) {
  const d = parseCccd(text);
  if (!d) return toast('Mã QR này không phải mã CCCD hợp lệ.', 'err');
  const nvName = S.currentNv && S.currentNv.HoVaTen;
  const mismatch = nvName && fold(nvName) !== fold(d.HoVaTen);
  const rows = [['Số CCCD', d.SoCCCD], ['Số CMND cũ', d.SoCMND || '—'], ['Họ và tên', d.HoVaTen], ['Ngày sinh', fmtDate(d.NgaySinh)], ['Giới tính', d.GioiTinh], ['Thường trú', d.DiaChiThuongTru], ['Ngày cấp', fmtDate(d.NgayCap)]];
  modal({
    title: 'Thông tin đọc từ CCCD',
    body: (mismatch ? `<div class="alert warn">Họ tên trên CCCD (<b>${esc(d.HoVaTen)}</b>) khác với họ tên Nhân sự đã nhập (<b>${esc(nvName)}</b>). Vui lòng kiểm tra đúng thẻ của bạn; nếu Nhân sự nhập sai tên, hãy báo lại Nhân sự.</div>` : '') +
      `<dl class="kv">${rows.map(r => `<dt>${esc(r[0])}</dt><dd>${esc(r[1])}</dd>`).join('')}</dl>`,
    foot: '<button class="btn sec" data-close>Hủy</button><button class="btn" id="qrApply">Điền vào hồ sơ</button>',
  });
  $('#qrApply').onclick = () => {
    const set = (k, v) => { if (v && S.fmap[k]) { st.data[k] = v; delete st.errors[k]; rerenderField(root, st, k); } };
    set('SoCCCD', d.SoCCCD); set('SoCMND', d.SoCMND); set('NgaySinh', d.NgaySinh); set('GioiTinh', d.GioiTinh);
    set('DiaChiThuongTru', d.DiaChiThuongTru); set('NgayCap', d.NgayCap);
    if (!st.data.NoiCap && d.NgayCap) set('NoiCap', d.NgayCap >= '2024-07-01' ? 'Bộ Công an' : 'Cục Cảnh sát quản lý hành chính về trật tự xã hội');
    st.dirty = true; closeModal();
    if (st.onChange) st.onChange();
    toast('Đã điền thông tin từ CCCD. Vui lòng kiểm tra lại.', 'ok');
  };
}

  if (s === 'CHUA_BAT_DAU' || s === 'NHAP') return `<div class="alert info">Vui lòng quét CCCD, điền đầy đủ thông tin và tải lên giấy tờ, sau đó bấm <b>Nộp hồ sơ</b>. Bạn có thể <b>Lưu nháp</b> và quay lại sau.</div>`;

  let h = `<div class="alert ok">Hồ sơ của bạn đã được duyệt${P.ngayDuyet ? ' ngày ' + esc(P.ngayDuyet) : ''}. Nếu thông tin có thay đổi, hãy gửi <b>Yêu cầu chỉnh sửa</b>.</div>`;
  if (P.editRequest) h += `<div class="alert warn">Yêu cầu chỉnh sửa gửi lúc ${esc(P.editRequest.ngayTao)} đang chờ Nhân sự xử lý:<br><i>${esc(P.editRequest.lyDo)}</i></div>`;

  return h;
}

  if (pendingReq) {
    $('#rqOk').onclick = () => resolveRequest(pendingReq.id, true, () => hrOpen(maNV));
    $('#rqNo').onclick = () => resolveRequest(pendingReq.id, false, () => hrOpen(maNV));
  }

  const bar = $('#hrBar');
  const pending = P.status === 'CHO_DUYET';
  const canUnlock = EDITABLE.indexOf(P.status) < 0 && !pending;
  bar.innerHTML = `<span class="status-txt spacer">${pending ? 'Kiểm tra, chỉnh sửa (nếu cần) rồi duyệt' : 'Nhân sự có thể sửa trực tiếp và lưu'}</span>` +
    (pending ? '<button class="btn danger" id="bReject">Trả lại</button><button class="btn ok" id="bApprove">✓ Duyệt & lưu hồ sơ</button>'
      : (canUnlock ? '<button class="btn sec" id="bUnlock">Mở cho NV chỉnh sửa</button>' : '') + '<button class="btn" id="bApprove">💾 Lưu vào hồ sơ</button>');

  $('#bApprove').onclick = async () => {
    const errs = validateClient(st.data);
    const missing = Object.keys(errs);
    const note = await ask({
      title: pending ? 'Duyệt hồ sơ' : 'Lưu thay đổi',
      ok: pending ? 'Duyệt & lưu' : 'Lưu', cls: 'ok',
      html: `<p>Thông tin sẽ được ghi vào sheet <b>ThongTinCaNhan</b>.</p>` + (missing.length ? `<div class="alert warn">Còn ${missing.length} mục thiếu/chưa đúng: ${missing.map(k => esc(S.fmap[k].label)).join(', ')}</div>` : ''),
      input: 'Ghi chú (không bắt buộc)',
    });
    if (note === null) return;
    try {
      await run('Đang lưu hồ sơ…', () => call('hrSave', { maNV, data: st.data, received: st.received, note }));
      st.dirty = false; S.dirtyForm = null;
      toast(pending ? 'Đã duyệt và lưu hồ sơ' : 'Đã lưu hồ sơ', 'ok');
      await refreshMeta();
      if (pending) renderHr('pending'); else hrOpen(maNV);
    } catch (e) { toast(e.message, 'err', 9000); }
  };
  if (pending) $('#bReject').onclick = async () => {
    const note = await ask({ title: 'Trả lại hồ sơ cho nhân viên', input: 'Nội dung cần bổ sung/chỉnh sửa', required: true, placeholder: 'VD: Ảnh CCCD bị mờ, vui lòng chụp lại; thiếu giấy khám sức khỏe…', ok: 'Trả lại', cls: 'danger' });
    if (note === null) return;
    try {
      await run('Đang xử lý…', () => call('hrReject', { maNV, note }));
      st.dirty = false; S.dirtyForm = null;
      toast('Đã trả lại hồ sơ và gửi email cho nhân viên', 'ok');
      await refreshMeta(); renderHr('pending');
    } catch (e) { toast(e.message, 'err'); }
  };
  if (canUnlock) $('#bUnlock').onclick = async () => {
    const note = await ask({ title: 'Mở hồ sơ cho nhân viên chỉnh sửa', input: 'Lời nhắn cho nhân viên', placeholder: 'VD: Vui lòng cập nhật giấy khám sức khỏe năm nay', ok: 'Mở chỉnh sửa' });
    if (note === null) return;
    try { await run('Đang xử lý…', () => call('hrUnlock', { maNV, note })); st.dirty = false; toast('Đã mở hồ sơ và gửi email cho nhân viên', 'ok'); hrOpen(maNV); } catch (e) { toast(e.message, 'err'); }
  };
}

function historyHtml(P) {
  const reqs = P.requests || [];
  const logs = P.logs || [];
  if (!reqs.length && !logs.length) return '';
  return `<div class="card"><h3>Lịch sử</h3>
    ${reqs.length ? `<p class="small"><b>Yêu cầu chỉnh sửa</b></p><ul class="timeline">${reqs.map(r => `<li><b>${esc(r.ngayTao)}</b> – ${esc(r.lyDo)} <span class="badge b-${r.trangThai === 'CHAP_NHAN' ? 'DA_DUYET' : r.trangThai === 'TU_CHOI' ? 'TU_CHOI' : 'CHO_DUYET'}">${esc(YC_LABEL[r.trangThai] || r.trangThai)}</span>${r.phanHoi ? `<br><span class="muted">Phản hồi: ${esc(r.phanHoi)}</span>` : ''}</li>`).join('')}</ul>` : ''}
    ${logs.length ? `<p class="small" style="margin-top:12px"><b>Nhật ký</b></p><ul class="timeline">${logs.map(l => `<li><b>${esc(l.t)}</b> · ${esc(LOG_LABEL[l.a] || l.a)} · <span class="muted">${esc(l.u)}</span>${l.d ? ` – ${esc(l.d)}` : ''}</li>`).join('')}</ul>` : ''}
  </div>`;
}

async function resolveRequest(id, accept, after) {
  const note = await ask(accept
    ? { title: 'Chấp nhận yêu cầu chỉnh sửa', html: '<p>Hồ sơ sẽ được mở để nhân viên tự chỉnh sửa và nộp lại.</p>', input: 'Lời nhắn (không bắt buộc)', ok: 'Chấp nhận', cls: 'ok' }
    : { title: 'Từ chối yêu cầu chỉnh sửa', input: 'Lý do từ chối', required: true, ok: 'Từ chối', cls: 'danger' });
  if (note === null) return;
  try {
    await run('Đang xử lý…', () => call('hrResolveRequest', { id, accept, note }));
    toast(accept ? 'Đã mở hồ sơ cho nhân viên chỉnh sửa' : 'Đã từ chối yêu cầu', 'ok');
    await refreshMeta();
    after();
  } catch (e) { toast(e.message, 'err'); }
}

async function hrRequests(body) {
  body.innerHTML = `<div class="filters"><select class="input" id="rqf"><option value="CHO_XU_LY">Đang chờ xử lý</option><option value="ALL">Tất cả</option></select></div><div id="rqList">${LOADING}</div>`;
  $('#rqf', body).value = S.reqSt;
  $('#rqf', body).onchange = e => { S.reqSt = e.target.value; hrRequests(body); };
  let list;
  try { list = await call('hrEditRequests', { status: S.reqSt }); } catch (e) { $('#rqList', body).innerHTML = `<div class="alert err">${esc(e.message)}</div>`; return; }
  const el = $('#rqList', body);
  if (!list.length) { el.innerHTML = '<div class="empty">Không có yêu cầu chỉnh sửa nào</div>'; return; }
  el.innerHTML = list.map(r => `<div class="card req-card"><div class="row"><b>${esc(r.hoTen)}</b><span class="muted small">${esc(r.maNV)}${r.donVi ? ' · ' + esc(r.donVi) : ''} · ${esc(r.ngayTao)}</span><span class="spacer"></span><span class="badge b-${r.trangThai === 'CHAP_NHAN' ? 'DA_DUYET' : r.trangThai === 'TU_CHOI' ? 'TU_CHOI' : 'CHO_DUYET'}">${esc(YC_LABEL[r.trangThai] || r.trangThai)}</span></div>
    <p style="white-space:pre-wrap;margin:10px 0">${esc(r.lyDo)}</p>${r.phanHoi ? `<p class="small muted">Phản hồi: ${esc(r.phanHoi)} (${esc(r.nguoiXuLy)})</p>` : ''}
    <div class="row"><button class="btn sec sm" data-open="${esc(r.maNV)}">Xem hồ sơ</button>${r.trangThai === 'CHO_XU_LY' ? `<button class="btn ok sm" data-acc="${esc(r.id)}">Chấp nhận – mở cho NV sửa</button><button class="btn sec sm" data-rej="${esc(r.id)}">Từ chối</button>` : ''}</div></div>`).join('');
  $$('[data-open]', el).forEach(b => { b.onclick = () => hrOpen(b.dataset.open); });
  $$('[data-acc]', el).forEach(b => { b.onclick = () => resolveRequest(b.dataset.acc, true, () => renderHr('requests')); });
  $$('[data-rej]', el).forEach(b => { b.onclick = () => resolveRequest(b.dataset.rej, false, () => renderHr('requests')); });
}

function hrAdd(body) {
  const lists = (S.hrMeta && S.hrMeta.lists) || {};
  const f2 = f => {
    const id = 'nv_' + f.key.replace(/\W/g, '_');
    const lbl = `<label class="lbl" for="${id}">${esc(f.label)}${f.required ? '<span class="req">*</span>' : ''}</label>`;
    if (f.type === 'textarea') return `<div class="field full">${lbl}<textarea id="${id}" data-nv="${esc(f.key)}" rows="2"></textarea></div>`;
    const type = { date: 'date', email: 'email', tel: 'tel' }[f.type] || 'text';
    const l = lists[f.key] || [];
    return `<div class="field">${lbl}<input type="${type}" id="${id}" data-nv="${esc(f.key)}" value="${esc(f.def || '')}" ${l.length ? `list="dl${id}"` : ''} autocomplete="off">${l.length ? `<datalist id="dl${id}">${l.map(v => `<option value="${esc(v)}">`).join('')}</datalist>` : ''}</div>`;
  };
  body.innerHTML = `<div class="card"><h3>Thêm nhân viên mới</h3>
    <p class="muted small">Thông tin sẽ được ghi vào sheet <b>ThongTinNhanVien</b>. Nhân viên dùng <b>email cá nhân</b> bên dưới để đăng nhập và tự khai hồ sơ.</p>
    <div class="grid">${S.nvFields.map(f2).join('')}</div>
    <label class="row small" style="margin-top:14px;gap:8px"><input type="checkbox" id="nvInvite" checked> Gửi email mời nhân viên cập nhật hồ sơ</label>
    <div class="row end" style="margin-top:14px"><button class="btn sec" id="nvReset">Nhập lại</button><button class="btn" id="nvSave">Thêm nhân viên</button></div></div>`;
  $('#nvReset', body).onclick = () => hrAdd(body);
  $('#nvSave', body).onclick = async () => {
    const data = {};
    let bad = null;
    $$('[data-nv]', body).forEach(el => {
      const k = el.dataset.nv; data[k] = el.value.trim();
      const f = S.nvFields.filter(x => x.key === k)[0];
      const fe = el.closest('.field');
      const wrong = (f.required && !data[k]) || (f.type === 'email' && data[k] && !EMAIL_RE.test(data[k]));
      fe.classList.toggle('err', !!wrong);
      if (wrong && !bad) bad = el;
    });
    if (bad) { bad.focus(); return toast('Vui lòng nhập đủ và đúng các mục bắt buộc', 'err'); }
    try {
      const r = await run('Đang thêm nhân viên…', () => call('hrAddEmployee', { data, sendInvite: $('#nvInvite', body).checked }));
      toast('Đã thêm nhân viên ' + r.maNV + (r.invited ? ' và gửi lời mời' : ''), 'ok');
      S.hrMeta = null;
      const go = await ask({ title: 'Đã thêm nhân viên', html: `<p>Đã thêm <b>${esc(data.HoVaTen)}</b> (${esc(r.maNV)}).</p>`, ok: 'Thêm người khác', cancel: 'Mở hồ sơ vừa tạo' });
      if (go === null) { await refreshMeta(); hrOpen(r.maNV); } else { await refreshMeta(); renderHr('add'); }
    } catch (e) { toast(e.message, 'err', 8000); }
  };
}

boot();
})();
</script>
